<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtreme Internet - Gift Checker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-blue-dark: #0077ff;
            --neon-orange: #ff6600;
            --neon-orange-light: #ff9900;
            --bg-dark: #07070a;
            --panel-bg: #111218;
        }

        body {
            /* Updated to Outfit */
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at top right, rgba(0, 119, 255, 0.1), transparent 40%),
                radial-gradient(circle at bottom left, rgba(255, 102, 0, 0.05), transparent 40%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--panel-bg);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 
                0 0 20px rgba(0, 119, 255, 0.2),
                inset 0 0 15px rgba(0, 212, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-orange));
        }

        .logo-img {
            width: 100%;
            max-width: 240px;
            margin: 0 auto 20px auto;
            display: block;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.3));
        }

        h2 { 
            /* Updated to Space Grotesk */
            font-family: 'Space Grotesk', sans-serif; 
            margin: 0 0 10px 0; 
            color: #ffffff;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        p { 
            color: #a0aec0; 
            font-size: 1.1rem; 
            margin-bottom: 25px; 
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #2d3748;
            border-radius: 8px;
            color: var(--neon-blue);
            font-size: 1.1rem;
            /* Updated to Space Grotesk */
            font-family: 'Space Grotesk', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        #voucherCode {
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input::placeholder {
            color: #4a5568;
            /* Updated to Outfit */
            font-family: 'Outfit', sans-serif;
            text-transform: none;
            letter-spacing: normal;
        }

        input:focus { 
            border-color: var(--neon-blue); 
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.05);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--neon-orange), var(--neon-orange-light));
            color: white;
            border: none;
            border-radius: 8px;
            /* Updated to Space Grotesk */
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
            margin-top: 10px;
        }
